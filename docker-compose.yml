services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
  migrate:
    build: .
    entrypoint: ["helpdesk-migrate"]
    environment:
      DATABASE_URL: postgres://helpdesk:helpdesk_dev@db:5432/helpdesk?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]
  seed:
    build: .
    entrypoint: ["helpdesk-seed"]
    environment:
      DATABASE_URL: postgres://helpdesk:helpdesk_dev@db:5432/helpdesk?sslmode=disable
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: AdminPass123!
      SEED_AGENT_EMAIL: agent@example.com
      SEED_AGENT_PASSWORD: AgentPass123!
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]
  api:
    build: .
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://helpdesk:helpdesk_dev@db:5432/helpdesk?sslmode=disable
      JWT_SECRET: local-docker-secret-change-before-sharing
      JWT_EXPIRY: 30m
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  helpdesk_data:
