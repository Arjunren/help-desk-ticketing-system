name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25.x', cache: true }
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/api ./cmd/migrate ./cmd/seed
